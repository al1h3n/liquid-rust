[package]
name = "liquid-rust-web"
version = "0.1.0"
edition = "2024"
publish = false
description = "WebGPU (wasm) bindings for liquid-rust"

[lib]
crate-type = ["cdylib"]

[dependencies]
liquid-rust = { path = ".." }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["HtmlCanvasElement", "ImageBitmap"] }
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "wgsl", "std"] }
